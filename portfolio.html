<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แฟ้มสะสมงานของฉัน</title>

<style>
body{
    font-family: sans-serif;
    background-color:#D2B48C;
    text-align:center;
    padding:30px;
}

.container{
    max-width:800px;
    margin:auto;
}

/* รูปโปรไฟล์ */
.profile{
    width:180px;
    height:180px;
    border:4px solid white;
    border-radius:50%;
    overflow:hidden;
    margin:0 auto 20px;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#777;
    font-size:18px;
}

.profile img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.project-card{
    background:white;
    padding:20px;
    margin:20px 0;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
    text-align:left;
}

.image-box{
    width:100%;
    max-width:400px;
    height:250px;
    border:2px dashed #999;
    border-radius:8px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:15px auto;
    background:#f5f5f5;
    color:#666;
}

.btn{
    display:inline-block;
    background:#2c3e50;
    color:white;
    padding:10px 20px;
    text-decoration:none;
    border-radius:5px;
    margin-top:20px;
}

.btn:hover{
    background:#34495e;
}
</style>

</head>
<body>

<div class="container">

    <!-- รูปโปรไฟล์ -->
    <div class="profile">
        <img src="Screenshot 2026-06-30 105442.png" alt="รูปโปรไฟล์">
    </div>

    <h1>แฟ้มสะสมงาน (Portfolio)</h1>
    <p>นี่คือพื้นที่รวบรวมผลงานและกิจกรรมที่ภาคภูมิใจ</p>

    <div class="project-card">
        <h3>1. โครงงานวิทยาศาสตร์การคำนวณ</h3>

        <div class="image-box">
            📷 ใส่รูปผลงาน
        </div>

        <p>รายละเอียดผลงาน...</p>
    </div>

    <div class="project-card">
        <h3>2. กิจกรรม/เกียรติบัตรที่ได้รับ</h3>

        <div class="image-box">
            📷 ใส่รูปกิจกรรม
        </div>

        <p>รายละเอียดกิจกรรม...</p>
    </div>

    <a href="index.html" class="btn">กลับหน้าแรก</a>

</div>

</body>
</html>
