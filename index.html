<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>หน้าแนะนำตัวของฉัน</title>
<style>
/* ตั้งค่าพื้นหลังเป็นสีฟ้าพาสเทล และใส่ฝูงผีเสื้อสีขาวบินกระจายทั่วจอ */
body {
    background-color: #D6E4F0; 
    background-image: url('https://picmix.com');
    background-size: 180px; /* ปรับขนาดของฝูงผีเสื้อ */
    color: #333;
    text-align: center; 
    padding: 50px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
}

/* ปรับแต่งกล่องการ์ดให้ละมุนและมีผีเสื้อบินประดับมุม */
.card {
    background: rgba(255, 255, 255, 0.92); /* ขาวละมุนแบบโปร่งแสงนิดๆ ให้เห็นผีเสื้อด้านหลัง */
    border-radius: 30px;
    box-shadow: 0 10px 25px rgba(179, 197, 255, 0.4); /* เงาสีฟ้าพาสเทล */
    max-width: 500px; 
    margin: 40px auto; 
    padding: 40px 30px;
    border: 2px solid #B3C5FF; /* เส้นขอบสีฟ้าพาสเทล */
    position: relative;
}

h1 { 
    color: #4A90E2; /* หัวข้อสีฟ้าเข้มเข้าธีม */
    margin-top: 10px;
}

p { 
    font-size: 18px; 
    line-height: 1.6; 
    color: #5D6D7E;
}

/* ออกแบบปุ่มกด "แฟ้มสะสมผลงาน" ให้เป็นสีฟ้าพาสเทลฟรุ้งฟริ้ง */
.btn {
    display: inline-block;
    background-color: #B3C5FF;
    color: white;
    padding: 12px 30px;
    text-decoration: none;
    border-radius: 25px;
    font-weight: bold;
    font-size: 16px;
    margin-top: 20px;
    box-shadow: 0 4px 10px rgba(179, 197, 255, 0.5);
    transition: all 0.3s ease;
}

/* ลูกเล่นเวลาเอาเมาส์ไปชี้ที่ปุ่ม */
.btn:hover {
    background-color: #94AFFF;
    transform: translateY(-3px);
    box-shadow: 0 6px 15px rgba(148, 175, 255, 0.6);
}
</style>
</head>
<body>

<div class="card">
  <!-- ไอคอนผีเสื้อพิกเซลบินดุ๊กดิ๊กด้านบนชื่อ -->
  <img src="https://tenor.com" width="50" style="margin-bottom: 10px;" />
  
  <h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน</h1>
  <p>สวัสดีค่าาา! ฉันชื่อ <strong>พีรดา (Perada)</strong></p>
  <p>ขณะนี้กำลังศึกษา/สนใจด้าน Computer Science & Engineering</p>
  <p>นี่คือเว็บไซต์แรกของฉันที่โฮสต์บน GitHub Pages!</p>
  
  <a href="portfolio.html" class="btn">🦋 แฟ้มสะสมผลงาน</a>
</div>

</body>
</html>
