<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>หน้าแนะนำตัวของฉัน</title>
<style>
/* ตั้งค่าพื้นหลังเป็นสีฟ้าพาสเทลไล่เฉดสีแบบนุ่มนวล (ไร้รูปภาพ) */
body {
    background: linear-gradient(135deg, #e6f2ff 0%, #cce0ff 100%);
    color: #333;
    text-align: center; 
    padding: 50px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ปรับแต่งการ์ดโทนฟ้าพาสเทลโปร่งแสงสไตล์ Glassmorphism */
.card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px);
    border-radius: 30px;
    box-shadow: 0 15px 35px rgba(160, 195, 230, 0.4);
    max-width: 500px; 
    margin: 0 auto; 
    padding: 40px 30px;
    border: 2px solid #b3d1ff;
    position: relative;
    transition: transform 0.3s ease;
}

/* เอฟเฟกต์การ์ดลอยขึ้นเบาๆ เมื่อวางเมาส์ */
.card:hover {
    transform: translateY(-5px);
}

/* สไตล์สำหรับรูปโปรไฟล์ (กรอบวงกลม) */
.profile-img-container {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    overflow: hidden;
    margin: 0 auto 25px auto; /* จัดกึ่งกลาง และเว้นระยะด้านล่าง */
    border: 5px solid white; /* เพิ่มเส้นขอบขาวดูนุ่มนวล */
    box-shadow: 0 5px 15px rgba(0,0,0,0.1); /* เพิ่มเงาเล็กน้อย */
}

.profile-img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* ทำให้รูปเต็มกรอบโดยไม่เสียสัดส่วน */
}

h1 { 
    color: #4a86e8; /* หัวข้อสีฟ้าพาสเทลสดใส */
    margin-top: 10px;
    margin-bottom: 15px;
    font-size: 28px;
}

p { 
    font-size: 18px; 
    line-height: 1.6; 
    color: #5c768d;
    margin: 10px 0;
}

/* ออกแบบปุ่มกดโทนฟ้าพาสเทล */
.btn {
    display: inline-block;
    background: linear-gradient(45deg, #82b1ff, #a4c2f4);
    color: white;
    padding: 12px 30px;
    text-decoration: none;
    border-radius: 25px;
    font-weight: bold;
    font-size: 16px;
    margin-top: 25px;
    box-shadow: 0 4px 15px rgba(130, 177, 255, 0.4);
    transition: all 0.3s ease;
}

/* ลูกเล่นเปลี่ยนเฉดสีเมื่อชี้ปุ่ม */
.btn:hover {
    background: linear-gradient(45deg, #a4c2f4, #82b1ff);
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(130, 177, 255, 0.6);
}
</style>
</head>
<body>

<div class="card">
    <!-- ส่วนแสดงรูปภาพโปรไฟล์ -->
    <div class="profile-img-container">
        <!-- **สำคัญ** ตรงนี้คุณต้องใส่ URL ของรูปภาพที่คุณอัปโหลดไว้ -->
        <!-- เช่น "https://i.imgur.com/your_image.jpg" หรือชื่อไฟล์ถ้าอยู่ในโฟลเดอร์เดียวกัน -->
        <img src="your_image.jpg" alt="โปรไฟล์ พีรดา" class="profile-img">
    </div>

    <h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน</h1>
    <p>สวัสดีค่าาา! ฉันชื่อ <strong>พีรดา (Perada)</strong></p>
    <p>ขณะนี้กำลังศึกษา/สนใจด้าน Computer Science & Engineering</p>
    <p>นี่คือเว็บไซต์แรกของฉันที่โฮสต์บน GitHub Pages!</p>
    
    <a href="portfolio.html" class="btn">แฟ้มสะสมผลงาน</a>
</div>

</body>
</html>
