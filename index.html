<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>หน้าแนะนำตัวของฉัน</title>
<style>
/* ตั้งค่าพื้นหลังเป็นสีฟ้าพาสเทลไล่เฉดสี และใส่เอฟเฟกต์ประกายดาวฟรุ้งฟริ้ง */
body {
    background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
    background-image: url('https://transparenttextures.com'); /* เพิ่มประกายดาวระยิบระยับทั่วจอ */
    color: #333;
    text-align: center; 
    padding: 50px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    min-height: 100vh;
}

/* ปรับแต่งกล่องการ์ดให้ละมุน มีความฟรุ้งฟริ้งแบบกระจกเงา (Glassmorphism) และขอบเรืองแสง */
.card {
    background: rgba(255, 255, 255, 0.85); /* ขาวละมุนแบบโปร่งแสงนิดๆ */
    backdrop-filter: blur(10px); /* เอฟเฟกต์กระจกเบลอสุดหรูด้านหลัง */
    border-radius: 30px;
    box-shadow: 0 15px 35px rgba(179, 197, 255, 0.6), 0 0 20px rgba(255, 255, 255, 0.8); /* เงาฟรุ้งฟริ้งเรืองแสง */
    max-width: 500px; 
    margin: 40px auto; 
    padding: 40px 30px;
    border: 2px solid rgba(179, 197, 255, 0.7); /* เส้นขอบฟ้าพาสเทลนุ่มๆ */
    position: relative;
    transition: transform 0.3s ease;
}

/* ลูกเล่นให้การ์ดลอยขึ้นเบาๆ เวลาเอาเมาส์ไปวาง */
.card:hover {
    transform: translateY(-5px);
}

h1 { 
    color: #4A90E2; /* หัวข้อสีฟ้าเข้มเข้าธีม */
    margin-top: 10px;
    text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8); /* เพิ่มมิติข้อความ */
}

p { 
    font-size: 18px; 
    line-height: 1.6; 
    color: #5D6D7E;
}

/* ออกแบบปุ่มกด "แฟ้มสะสมผลงาน" ให้เป็นสีฟ้าพาสเทลฟรุ้งฟริ้งระยิบระยับ */
.btn {
    display: inline-block;
    background: linear-gradient(45deg, #B3C5FF, #94AFFF); /* ไล่เฉดสีปุ่มให้ดูแพง */
    color: white;
    padding: 12px 30px;
    text-decoration: none;
    border-radius: 25px;
    font-weight: bold;
    font-size: 16px;
    margin-top: 20px;
    box-shadow: 0 4px 15px rgba(179, 197, 255, 0.5);
    transition: all 0.3s ease;
}

/* ลูกเล่นเรืองแสงกระพริบเวลาเอาเมาส์ไปชี้ที่ปุ่ม */
.btn:hover {
    background: linear-gradient(45deg, #94AFFF, #B3C5FF);
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(148, 175, 255, 0.8), 0 0 10px rgba(255, 255, 255, 0.5);
}
</style>
</head>
<body>

<div class="card">
  <!-- ไอคอนผีเสื้อพิกเซลบินดุ๊กดิ๊กด้านบนชื่อ (อัปเดตลิงก์ไอคอนเคลื่อนไหวให้แล้ว) -->
  <img src="https://openmoji.org" width="60" style="margin-bottom: 10px; animation: float 3s ease-in-out infinite;" />
  
  <h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน</h1>
  <p>สวัสดีค่าาา! ฉันชื่อ <strong>พีรดา (Perada)</strong></p>
  <p>ขณะนี้กำลังศึกษา/สนใจด้าน Computer Science & Engineering</p>
  <p>นี่คือเว็บไซต์แรกของฉันที่โฮสต์บน GitHub Pages!</p>
  
  <a href="portfolio.html" class="btn">🦋 แฟ้มสะสมผลงาน</a>
</div>

<script>
// ลูกเล่นเสริม: แอนิเมชันทำให้ผีเสื้อลอยขึ้นลงนุ่มๆ
const style = document.createElement('style');
style.innerHTML = `
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
}`;
document.head.appendChild(style);
</script>

</body>
</html>
